<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#9B51E0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0B0F19"/>
  <!-- Phone Frame -->
  <rect x="136" y="76" width="240" height="360" rx="36" fill="none" stroke="url(#cyberGrad)" stroke-width="24" filter="url(#glow)"/>
  <!-- Lightning Bolt -->
  <path d="M256 120 L300 230 L260 230 L290 340 L216 250 L252 250 Z" fill="url(#cyberGrad)"/>
  <!-- Wrench Accent -->
  <path d="M330 330 L360 360 M345 315 A20 20 0 0 1 375 345" stroke="url(#cyberGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Home Indicator -->
  <circle cx="256" cy="405" r="12" fill="url(#cyberGrad)"/>
</svg>
